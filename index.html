<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="jpg" href="/icon/filimo-icon.jpeg" />
    <link rel="stylesheet" href="src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>فیلیمومدرسه | آموزش تعاملی به شیوه نو | فیلیمو مدرسه</title>
  </head>
  <body class="mx-auto">
    <header class="w-full h-15 md:h-25 px-4 md:px-20">
      <nav class="w-full h-full flex items-center justify-between">
        <!-- menu button -->
        <button class="cursor-pointer">
          <img src="/icon/menu.svg" alt="menu button" />
        </button>
        <!-- center logo -->
        <a href="#">
          <img
            src="/icon/filimo-full-logo.svg"
            class="w-37 sm:w-auto"
            alt="filimo"
          />
        </a>
        <!-- login -->
        <a
          href="#"
          class="flex font-vazir-md items-center justify-center gap-1"
        >
          ورود
          <img src="/icon/login.svg" alt="login" class="rotate-y-180" />
        </a>
      </nav>
    </header>
    <main>
      <section
        class="w-full bg-linear-to-b from-orange-200 to-white h-fit sm:h-100 flex items-center justify-center"
      >
        <div
          class="h-3/4 overflow-hidden sm:rounded-2xl relative"
        >
          <button
            class="absolute top-5 right-5 text-sm rounded-md p-1 backdrop-invert backdrop-opacity-10 z-1 bg-white/80 cursor-pointer text-center"
            id="sound-control-BTN"
            type="button"
          >
            با صدا ببینید
            
          </button>
          <video
            class="w-full z-2 h-full"
            id="intro-video"
            autoplay
            muted
            loop
            playsinline
          >
            <source src="/video/intro-summer-3-480p-30.mp4" type="video/mp4" />
          </video>
        </div>
      </section>
      <a
        href="#"
        class="w-80 h-12 mx-auto rounded-lg hidden font-vazir-md items-center justify-center gap-1 bg-green-300 border-b-5 border-b-green-500 text-[#444444] hover:border-b-1 duration-200 sm:flex"
      >
        <!-- <img src="/icon/login.svg" alt="login" class="rotate-y-180" /> -->
        ورود به فیلیمو مدرسه
      </a>
    </main>
    <script src="src/main.ts"></script>
  </body>
</html>
